<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F7B6C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>حروف يوسف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one thing at a time. Home = a 26-tile letter board; Lesson = one huge letter, its picture, one tap-to-answer question. */
:root{
  --bg:#F3F7F4; --card:#FFFFFF; --ink:#16302B; --soft:#5E7570; --line:#D7E4DF;
  --pri:#0F7B6C; --pri-d:#0A5A4F; --sun:#FFB627; --sun-d:#D98F00; --ok:#1FA971; --no:#E5484D; --lock:#E6EEEB;
  --ar:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --lt:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1D1A;--card:#182B27;--ink:#E8F3EF;--soft:#9BB4AD;--line:#2A433D;--pri:#2BB39F;--pri-d:#1B7D6F;--lock:#1E322E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1D1A;--card:#182B27;--ink:#E8F3EF;--soft:#9BB4AD;--line:#2A433D;--pri:#2BB39F;--pri-d:#1B7D6F;--lock:#1E322E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:18px;line-height:1.6}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.en{font-family:var(--lt);direction:ltr;unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:26px;font-weight:800;flex:1}
.stars{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;font-variant-numeric:tabular-nums}
.say{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 18px;font-weight:700;font-size:19px}
.bar{height:12px;background:var(--lock);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:22px;font-size:22px;font-weight:800;background:var(--pri);color:#fff;box-shadow:0 6px 0 var(--pri-d)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pri-d)}
.big.sun{background:var(--sun);color:#3A2600;box-shadow:0 6px 0 var(--sun-d)}
.big.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line);border:2px solid var(--line)}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--card);border:2px solid var(--line);font-family:var(--lt);font-size:26px;font-weight:700;display:grid;place-items:center;color:var(--pri)}
.tile.lock{background:var(--lock);color:var(--soft);opacity:.6}
.tile.next{background:var(--sun);border-color:var(--sun-d);color:#3A2600;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}88%{transform:scale(1.12)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px 16px;display:grid;justify-items:center;gap:6px;text-align:center}
.letter{font-family:var(--lt);font-size:clamp(96px,32vw,150px);line-height:1;font-weight:700;color:var(--pri);direction:ltr;letter-spacing:10px}
.pic{font-size:72px;line-height:1.1}
.word{font-family:var(--lt);font-size:34px;font-weight:700;direction:ltr}
.word b{color:var(--no)}
.hint{color:var(--soft);font-size:17px}
.sound{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--sun);color:#3A2600;font-weight:800;box-shadow:0 4px 0 var(--sun-d)}
.q{font-size:22px;font-weight:800;text-align:center}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-family:var(--lt);font-size:clamp(44px,14vw,64px);font-weight:700;color:var(--ink);display:grid;place-items:center}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{animation:shake .35s;border-color:var(--no)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dl{text-decoration:none;font-size:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.win{text-align:center;font-size:24px;font-weight:800;color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app" class="wrap" dir="rtl" lang="ar"></div>

<script>
(() => {
const L = [
 ['A','إيه','أَ','apple','🍎','تفاحة'],['B','بي','ب','ball','⚽','كرة'],['C','سي','ك','cat','🐱','قطة'],['D','دي','د','dog','🐶','كلب'],
 ['E','إي','إِ','egg','🥚','بيضة'],['F','إف','ف','fish','🐟','سمكة'],['G','جي','گ (ج مصرية)','goal','🥅','هدف'],['H','إيتش','هـ','hat','🧢','قبعة'],
 ['I','آي','إِ','ice','🧊','ثلج'],['J','جيه','ج','juice','🧃','عصير'],['K','كيه','ك','key','🔑','مفتاح'],['L','إل','ل','lion','🦁','أسد'],
 ['M','إم','م','moon','🌙','قمر'],['N','إن','ن','nose','👃','أنف'],['O','أو','أُ','orange','🍊','برتقالة'],['P','پي','پ (ب منفوخة)','pizza','🍕','بيتزا'],
 ['Q','كيو','كْو','queen','👸','ملكة'],['R','آر','ر','rabbit','🐰','أرنب'],['S','إس','س','sun','☀️','شمس'],['T','تي','ت','tiger','🐯','نمر'],
 ['U','يو','أَ','umbrella','☂️','مظلة'],['V','ڤي','ڤ','van','🚐','باص صغير'],['W','دبليو','و','water','💧','مَيّ'],['X','إكس','كْس','box','📦','صندوق'],
 ['Y','واي','ي','yes','✅','نعم'],['Z','زِد','ز','zoo','🦓','حديقة حيوانات'],
].map(([U,n,s,w,e,m]) => ({ U, l: U.toLowerCase(), n, s, w, e, m }));

const KEY = 'yousef-abc.v1';
let S = { n: 0, stars: 0 };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const AR = x => String(x).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const app = document.getElementById('app');

/* sound: the phone's English voice */
let voice = null;
const pick = () => { try { const v = speechSynthesis.getVoices(); voice = v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; } catch (e) {} };
try { pick(); speechSynthesis.onvoiceschanged = pick; } catch (e) {}
function speak(t, rate = .75) { const C = window.Capacitor?.Plugins?.TextToSpeech; if (C) { C.stop?.().catch?.(() => {}); C.speak({ text: t, lang: 'en-US', rate: rate * 1.1, volume: 1, category: 'ambient' }).catch(() => {}); return; } try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); if (voice) u.voice = voice; u.lang = 'en-US'; u.rate = rate; speechSynthesis.speak(u); } catch (e) {} }
const sayLetter = x => speak(x.U + '.', .7);
const sayAll = x => { sayLetter(x); setTimeout(() => speak(x.w, .75), 1100); };
let AC; function beep(ok) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime; (ok ? [660, 880, 1175] : [260]).forEach((f, k) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; o.type = 'triangle'; g.gain.setValueAtTime(.0001, t + k * .09); g.gain.exponentialRampToValueAtTime(.15, t + k * .09 + .02); g.gain.exponentialRampToValueAtTime(.0001, t + k * .09 + .25); o.connect(g); g.connect(AC.destination); o.start(t + k * .09); o.stop(t + k * .09 + .3); }); } catch (e) {} }

/* ---- home: the letter board ---- */
function home() {
  const done = Math.min(S.n, 26), next = L[S.n];
  app.innerHTML = `
    <div class="top"><h1>أهلًا يوسف 👋</h1><span class="stars">⭐ ${AR(S.stars)}</span></div>
    <div class="say">${done === 26 ? '🏆 خلّصت كل الحروف! برافو يا بطل.' : done ? `تعلّمت ${AR(done)} من ٢٦ حرف. يلا نكمّل!` : 'رح نتعلّم حروف الإنجليزي، حرف حرف. سهلة!'}</div>
    <div class="bar"><i style="width:${done / 26 * 100}%"></i></div>
    ${next ? `<button class="big" id="go">▶️ ${done ? 'الحرف الجاي' : 'يلا نبلّش'}: <span class="en">${next.U}</span></button>` : ''}
    ${done >= 3 ? `<button class="big sun" id="game">🎮 لعبة مراجعة</button>` : ''}
    ${window.Capacitor ? '' : `<a class="big ghost dl" href="https://github.com/mhoaltanany-max/yousef-chat/releases/latest/download/yousef-abc.apk">📲 نزّل التطبيق على الجوال (أندرويد)</a>`}
    <div class="board">${L.map((x, k) => `<button class="tile ${k < S.n ? '' : k === S.n ? 'next' : 'lock'}" data-k="${k}" aria-label="${x.U}">${x.U}</button>`).join('')}</div>`;
  const go = document.getElementById('go'); if (go) go.onclick = () => lesson(S.n);
  const g = document.getElementById('game'); if (g) g.onclick = () => review();
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = +b.dataset.k; if (k <= S.n && k < 26) lesson(k); else { b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 400); } });
  scrollTo(0, 0);
}

/* ---- lesson: see and hear one letter, then find it ---- */
function lesson(k) {
  const x = L[k];
  app.innerHTML = `
    <div class="top"><button class="stars" id="back">→ رجوع</button><span style="flex:1"></span><span class="stars">${AR(k + 1)} / ٢٦</span></div>
    <button class="card" id="card" aria-label="اسمع">
      <div class="letter">${x.U}${x.l}</div>
      <div class="pic">${x.e}</div>
      <div class="word"><b>${x.w[0]}</b>${x.w.slice(1)}</div>
      <div class="hint">${x.m} · اسمه «${x.n}» وصوته «${x.s}»</div>
      <span class="sound">🔊 اسمع</span>
    </button>
    <button class="big" id="next">👍 عرفته، اسألني</button>`;
  document.getElementById('back').onclick = home;
  document.getElementById('card').onclick = () => sayAll(x);
  document.getElementById('next').onclick = () => quiz(k);
  setTimeout(() => sayAll(x), 300);
}
function quiz(k) {
  const x = L[k], others = shuffle(L.filter(y => y !== x)).slice(0, 2), opts = shuffle([x, ...others]);
  let tries = 0;
  app.innerHTML = `
    <div class="top"><button class="stars" id="back">→ رجوع</button><span style="flex:1"></span></div>
    <div class="q">اسمع… وين حرف <span class="pic" style="font-size:40px">${x.e}</span>؟</div>
    <button class="sound" id="again" style="justify-self:center">🔊 كمان مرة</button>
    <div class="opts">${opts.map((y, j) => `<button class="opt" data-j="${j}">${y.U}</button>`).join('')}</div>
    <div id="msg"></div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('again').onclick = () => sayLetter(x);
  setTimeout(() => sayLetter(x), 250);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const y = opts[+b.dataset.j];
    if (y !== x) { tries++; beep(false); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); sayLetter(x); return; }
    b.classList.add('ok'); beep(true); speak(x.w);
    if (tries === 0) S.stars++;
    if (k === S.n) S.n++;
    save();
    app.querySelectorAll('.opt').forEach(o => o.disabled = true);
    document.getElementById('msg').innerHTML = `<div class="win">${tries ? 'صح! 👏' : 'برافو يا يوسف! ⭐'}</div>
      <div class="row" style="margin-top:12px">${k + 1 < 26 ? `<button class="big" id="nx">الحرف الجاي ←</button>` : ''}<button class="big ghost" id="hm">🏠</button></div>`;
    const nx = document.getElementById('nx'); if (nx) nx.onclick = () => lesson(k + 1);
    document.getElementById('hm').onclick = home;
  });
}

/* ---- review game: 6 quick questions on learned letters ---- */
function review() {
  const pool = L.slice(0, Math.min(S.n, 26)); let q = 0, score = 0;
  const round = () => {
    if (q === 6) { app.innerHTML = `<div class="card"><div class="pic">🏆</div><div class="win">جبت ${AR(score)} من ٦</div></div><button class="big" id="hm">🏠 الرئيسية</button>`; document.getElementById('hm').onclick = home; beep(true); return; }
    const x = pool[Math.random() * pool.length | 0], mode = Math.random() < .5 ? 'pic' : 'hear';
    const opts = shuffle([x, ...shuffle(L.filter(y => y !== x)).slice(0, 2)]); let wrong = false;
    app.innerHTML = `
      <div class="top"><button class="stars" id="back">→ رجوع</button><span style="flex:1"></span><span class="stars">${AR(q + 1)} / ٦</span></div>
      <div class="q">${mode === 'pic' ? `<div class="pic">${x.e}</div><span class="en">${x.w}</span> بتبلّش بأي حرف؟` : 'اسمع… أي حرف؟'}</div>
      <button class="sound" id="again" style="justify-self:center">🔊 اسمع</button>
      <div class="opts">${opts.map((y, j) => `<button class="opt" data-j="${j}">${y.U}</button>`).join('')}</div>`;
    document.getElementById('back').onclick = home;
    const play = () => mode === 'pic' ? speak(x.w) : sayLetter(x);
    document.getElementById('again').onclick = play; setTimeout(play, 250);
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (opts[+b.dataset.j] !== x) { wrong = true; beep(false); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); return; }
      b.classList.add('ok'); beep(true); if (!wrong) { score++; S.stars++; save(); }
      q++; setTimeout(round, 800);
    });
  };
  round();
}

home();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>

</body>
</html>
